name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The engines floor (astro 7.4 needs >= 22.23.4) and the latest Node 22.
        node: ["22.23.4", "22"]
    steps:
      - uses: actions/checkout@v5

      # Version comes from packageManager in package.json (pnpm 11.9).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm astro check

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm vitest run

      - run: pnpm astro build

      # No Resend SDK or key in the browser bundle; no dev fake in the server bundle.
      - run: node tests/build/check-dist.mjs

      # Settings set as Worker variables after the build must not be inlined by it.
      - run: node tests/build/check-runtime-env.mjs

      - run: pnpm exec playwright install --with-deps chromium

      # portless run refuses to sudo without a TTY; proxy start elevates
      # through the runner's passwordless sudo and leaves the proxy up.
      - run: pnpm exec portless proxy start --https

      # Every suite, the per-role body-access suites included: they sign in
      # through EmDash's dev-only bypass, which the dev server Playwright starts
      # provides.
      - run: pnpm e2e --trace off

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
