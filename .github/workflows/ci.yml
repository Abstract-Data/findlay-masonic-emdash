name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Version comes from packageManager in package.json (pnpm 11.9).
      - uses: pnpm/action-setup@v4

      # Latest Node 22 (>= 22.16, the engines floor).
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm astro check

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm vitest run

      - run: pnpm astro build

      - run: pnpm exec playwright install --with-deps chromium

      # portless run refuses to sudo without a TTY; proxy start elevates
      # through the runner's passwordless sudo and leaves the proxy up.
      - run: pnpm exec portless proxy start --https

      - run: pnpm e2e --grep @smoke --trace off

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
